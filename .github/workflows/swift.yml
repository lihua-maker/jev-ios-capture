name: swift

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test:
    # A macOS runner has the real Apple Vision framework and a Swift toolchain, so both the port
    # and its measurement harness are verifiable without owning a Mac.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Parity + rule tests
        env:
          # Optional: add this secret and the live API checks stop being skipped.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail   # without this the pipe's exit status hides a failing test suite
          swift test 2>&1 | tail -60

      - name: Fixture inventory
        run: |
          echo "### capture-stage tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -1 Tests/ChatCaptureTests/Fixtures | sed 's/\.json$//' | paste -sd' ' - | fold -s -w 110 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  vision:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Run Vision over the corpus screenshots
        run: .build/release/visionlines shots vision_out

      - name: Summary
        run: |
          echo "### Apple Vision over the corpus" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in vision_out/*.ocr.json; do
            name=$(basename "$f" .ocr.json)
            lines=$(python3 -c "import json;print(len(json.load(open('$f'))['lines']))")
            size=$(python3 -c "import json;d=json.load(open('$f'));print(f\"{d['width']}x{d['height']}\")")
            printf '%-26s %-12s lines=%s\n' "$name" "$size" "$lines" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Sample output
        run: head -c 500 vision_out/s01_1v1_light_short.ocr.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: vision-ocr-json
          path: vision_out/*.ocr.json
          if-no-files-found: error