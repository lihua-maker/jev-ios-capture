name: render-parity

# The rules are driven by text metrics, and text metrics are font metrics. The reference corpus is
# rendered on Windows in Microsoft YaHei; an iPhone renders in PingFang SC. This job re-renders the
# SAME html with the platform's own font, recognises it with Apple Vision, and scores it with the
# same evaluator against the same ground truth — a font-shaped bug fails here instead of on a phone.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'oracle/**', 'corpus_html/**', 'Sources/ChatCapture/**', '.github/workflows/render-parity.yml' ]

jobs:
  font-and-renderer-parity:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version && python3 --version

      - name: Ensure Chrome is available
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$CHROME" ]; then brew install --cask google-chrome; fi
          "$CHROME" --version

      - name: Build the recogniser CLI
        run: |
          set -o pipefail
          swift build -c release --product visionlines 2>&1 | tail -5
          ls -l .build/release/visionlines

      - name: Render the corpus with this machine's fonts
        run: |
          set -o pipefail
          python3 oracle/render_parity.py --out "$RUNNER_TEMP/renders" \
            --visionlines .build/release/visionlines 2>&1 | tee "$RUNNER_TEMP/render.log"

      - name: Score the renders against the ground truth
        run: |
          set -o pipefail
          python3 oracle/run_corpus.py --ocr-files "$RUNNER_TEMP/renders" 2>&1 | tee "$RUNNER_TEMP/score.log"
          # Acceptance gate: the same rules must still reconstruct every conversation.
          grep -q "pipeline-pass 12/12" "$RUNNER_TEMP/score.log" \
            || { echo "::error::renderer/font parity regressed — see the table above"; exit 1; }

      - name: Report the accessibility text-size variants
        # Reported, not gated: the body font size changes every metric the rules key off, and the
        # current numbers (10/12 at 14px and 18px, the remainder being single-character bubbles the
        # recogniser misses at those sizes) are a measurement to keep visible, not a pass/fail.
        continue-on-error: true
        run: |
          set -o pipefail
          for px in 14 18; do
            echo "=== body font ${px}px"
            python3 oracle/render_parity.py --out "$RUNNER_TEMP/text$px" --font-px "$px" \
              --visionlines .build/release/visionlines 2>&1 | tail -3
            python3 oracle/run_corpus.py --ocr-files "$RUNNER_TEMP/text$px" 2>&1 \
              | tee "$RUNNER_TEMP/score_text$px.log" | grep -E "^(FAIL|pipeline-pass)" | tail -6
          done

      - name: Keep the renders and the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-parity
          path: |
            ${{ runner.temp }}/renders/*.png
            ${{ runner.temp }}/renders/*.ocr.json
            ${{ runner.temp }}/text14/*.ocr.json
            ${{ runner.temp }}/text18/*.ocr.json
            ${{ runner.temp }}/renders/metrics.json
            ${{ runner.temp }}/render.log
            ${{ runner.temp }}/score.log
            oracle/corpus_report_renders.json
          if-no-files-found: warn