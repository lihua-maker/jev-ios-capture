name: vision-parity

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  vision:
    # A macOS runner has the real Apple Vision framework, so VNRecognizeTextRequest can be
    # measured without owning a Mac.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Run Vision over the corpus screenshots
        run: .build/release/visionlines shots vision_out

      - name: Summary
        run: |
          echo "### Apple Vision over the corpus" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in vision_out/*.ocr.json; do
            name=$(basename "$f" .ocr.json)
            lines=$(python3 -c "import json,sys; print(len(json.load(open('$f'))['lines']))")
            size=$(python3 -c "import json; d=json.load(open('$f')); print(f\"{d['width']}x{d['height']}\")")
            printf '%-26s %-12s lines=%s\n' "$name" "$size" "$lines" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Sample output
        run: head -c 600 vision_out/s01_1v1_light_short.ocr.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: vision-ocr-json
          path: vision_out/*.ocr.json
          if-no-files-found: error